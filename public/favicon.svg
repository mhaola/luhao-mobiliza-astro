<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="sphere-clip">
      <circle cx="32" cy="32" r="32" />
    </clipPath>
    <linearGradient id="sphere-shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.22" />
    </linearGradient>
  </defs>

  <g clip-path="url(#sphere-clip)">
    <rect x="0" y="0" width="64" height="64" fill="#ff2fa8" />
    <g stroke="#ffffff" stroke-width="7" opacity="0.92">
      <line x1="-20" y1="60" x2="20" y2="-20" />
      <line x1="-8" y1="60" x2="32" y2="-20" />
      <line x1="4" y1="60" x2="44" y2="-20" />
      <line x1="16" y1="60" x2="56" y2="-20" />
      <line x1="28" y1="60" x2="68" y2="-20" />
      <line x1="40" y1="60" x2="80" y2="-20" />
      <line x1="52" y1="60" x2="92" y2="-20" />
    </g>
    <rect x="0" y="0" width="64" height="64" fill="url(#sphere-shade)" />
  </g>
</svg>
